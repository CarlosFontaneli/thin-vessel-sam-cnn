# cnn / drive / lwnet: settings of the selected trial (36) of the hyperparameter search,
# as recorded in its trial_36/config.yaml, and the search space as recorded in the Optuna study
# (key order = order of the suggest calls). Schema: configs/README.md.
seed: 42
model_name: lwnet
dataset_name: drive
selected_trial: 36
model_params: {in_c: 3, layers: '[8, 16, 32]', n_classes: 1}
dataset_params:
  augment: true
  augmentations: {hflip_prob: 0.5, rotation_degrees: 30.0, vflip_prob: 0.5}
  batch_size: 4
  image_size: 256
  num_workers: 4
  test_csv: ../../splits/drive_test.csv
  test_image_dir: DRIVE/test/images
  test_mask_dir: DRIVE/test/1st_manual
  train_csv: ../../splits/drive_train.csv
  train_image_dir: DRIVE/training/images
  train_mask_dir: DRIVE/training/1st_manual
  val_csv: ../../splits/drive_val.csv
  val_image_dir: DRIVE/training/images
  val_mask_dir: DRIVE/training/1st_manual
training_params: {deep_sup_weight: 1.0, lr: 0.0022476384302147004, max_epochs: 1000, optimizer: AdamW, patience: 50, roi_size: 256,
  weight_decay: 1.2092727025435916e-05}
search_space:
  optimizer:
    type: categorical
    choices: [torch.optim.AdamW, torch.optim.SGD, torch.optim.RMSprop]
  lr: {type: float, low: 1.0e-06, high: 0.1, log: true}
  weight_decay: {type: float, low: 1.0e-06, high: 0.1, log: true}
  patience: {type: int, low: 20, high: 100}
  batch_size:
    type: categorical
    choices: [2, 4, 8]
  layers:
    type: categorical
    choices: ['[8, 16, 32]', '[16, 32, 64]', '[32, 64, 128]']
