# cnn / fives / lwnet: settings of the selected trial (11) of the hyperparameter search,
# as recorded in its trial_11/config.yaml, and the search space as recorded in the Optuna study
# (key order = order of the suggest calls). Schema: configs/README.md.
seed: 42
model_name: lwnet
dataset_name: fives
selected_trial: 11
model_params: {in_c: 3, layers: '[8, 16, 32]', n_classes: 1}
dataset_params:
  augment: true
  augmentations: {hflip_prob: 0.5, rotation_degrees: 30.0, vflip_prob: 0.5}
  batch_size: 16
  image_size: 256
  num_workers: 2
  test_image_dir: FIVES/test/Original
  test_mask_dir: FIVES/test/Ground truth
  train_image_dir: FIVES/train/Original
  train_mask_dir: FIVES/train/Ground truth
  allow_test_as_val: true
training_params: {deep_sup_weight: 1.0, lr: 0.002785181098868776, max_epochs: 1000, optimizer: AdamW, patience: 50, roi_size: 256,
  weight_decay: 0.00012905395396653374}
search_space:
  optimizer:
    type: categorical
    choices: [torch.optim.AdamW, torch.optim.SGD, torch.optim.RMSprop]
  lr: {type: float, low: 1.0e-06, high: 0.1, log: true}
  weight_decay: {type: float, low: 1.0e-06, high: 0.1, log: true}
  patience: {type: int, low: 20, high: 100}
  batch_size:
    type: categorical
    choices: [2, 4, 8, 16, 32, 64]
  layers:
    type: categorical
    choices: ['[8, 16, 32]', '[16, 32, 64]', '[32, 64, 128]']
